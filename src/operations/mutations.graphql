    }
  }
}

mutation ArrayUnmountDisk($id: PrefixedID!) {
  array {
    unmountArrayDisk(id: $id) {
      id
      status
    }
  }
}

mutation ArrayClearDiskStatistics($id: PrefixedID!) {
  array {
    clearArrayDiskStatistics(id: $id)
  }
}

## Parity check control

mutation ParityCheckStart($correct: Boolean!) {
  parityCheck {
    start(correct: $correct)
  }
}

mutation ParityCheckPause {
  parityCheck {
    pause
  }
}

mutation ParityCheckResume {
  parityCheck {
    resume
  }
}

mutation ParityCheckCancel {
  parityCheck {
    cancel
  }
}

