## Docker control

mutation DockerStart($id: PrefixedID!) {
  docker {
    start(id: $id) {
      id
      state
      status
    }
  }
}

mutation DockerStop($id: PrefixedID!) {
  docker {
    stop(id: $id) {
      id
      state
      status
    }
  }
}

mutation DockerPause($id: PrefixedID!) {
  docker {
    pause(id: $id) {
      id
      state
      status
    }
  }
}

mutation DockerUnpause($id: PrefixedID!) {
  docker {
    unpause(id: $id) {
      id
      state
      status
    }
  }
}

mutation DockerUpdateContainer($id: PrefixedID!) {
  docker {
    updateContainer(id: $id) {
      id
      state
      status
    }
  }
}

mutation DockerRemoveContainer($id: PrefixedID!, $withImage: Boolean) {
  docker {
    removeContainer(id: $id, withImage: $withImage)
  }
}

