## Notification control

mutation NotificationArchive($id: PrefixedID!) {
  archiveNotification(id: $id) {
    id
    type
  }
}

mutation NotificationUnread($id: PrefixedID!) {
  unreadNotification(id: $id) {
    id
    type
  }
}

mutation NotificationArchiveAll($importance: NotificationImportance) {
  archiveAll(importance: $importance) {
    unread {
      ...NotificationCountsFields
    }
    archive {
      ...NotificationCountsFields
    }
  }
}

mutation NotificationDelete($id: PrefixedID!, $type: NotificationType!) {
  deleteNotification(id: $id, type: $type) {
    unread {
      ...NotificationCountsFields
    }
    archive {
      ...NotificationCountsFields
    }
  }
}

mutation NotificationDeleteArchived {
  deleteArchivedNotifications {
    unread {
      ...NotificationCountsFields
    }
    archive {
      ...NotificationCountsFields
    }
  }
}

mutation NotificationCreate($input: NotificationData!) {
  createNotification(input: $input) {
    ...NotificationFields
  }
}
